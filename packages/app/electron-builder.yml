# electron-builder configuration for autonomOS Desktop.
#
# Phase 1B.2: desktop is a THIN CLIENT. We bundle the autonomos-server binary
# in extraResources/server/ so the "Set up local server on this Mac" Welcome
# flow can invoke `autonomos install-service` from it. We do NOT spawn the
# server as a child process from Electron in production.
#
# Signing infrastructure is wired but disabled by default. To enable code-
# signing + notarization once Apple Developer Program enrollment completes,
# set these env vars before running `bun run build:dmg`:
#
#   CSC_LINK=path/to/cert.p12          (or use keychain via CSC_NAME)
#   CSC_KEY_PASSWORD=...
#   APPLE_ID=you@example.com
#   APPLE_APP_SPECIFIC_PASSWORD=...    (app-specific password from appleid.apple.com)
#   APPLE_TEAM_ID=...                  (10-char team ID from developer.apple.com)
#
# When those are unset, electron-builder produces an unsigned .app. Users on
# macOS Sequoia (15) will see the "cannot be opened" Gatekeeper warning until
# they approve via System Settings → Privacy & Security.

appId: cloud.terrylu.autonomos
productName: autonomOS
copyright: Copyright © 2026 Terry Lu

# Auto-update feed — electron-updater reads latest-mac.yml + the .zip + .blockmap
# from the GitHub Release. Setting publish here makes electron-builder GENERATE
# those feed files at build time even when invoked with `--publish never` (the
# release CI uploads them itself). Wired for electron-updater in PR #5.
publish:
  provider: github
  owner: aterrylu
  repo: autonomOS

directories:
  output: out
  buildResources: build-resources

files:
  - "dist/**/*"
  - "node_modules/**/*"
  - "!node_modules/**/{*.md,*.markdown,LICENSE,license,COPYING,changelog,CHANGELOG*}"

# ADR-029 — bundled autonomos-server + Node runtime live in Resources/
# inside the .app. The Desktop's server-supervisor spawns the bundled
# server with the bundled Node binary so brand-new Macs without Node
# installed can run Built-in mode. Both staged by scripts/build-dmg.sh.
extraResources:
  - from: "resources/server"
    to: "server"
    filter: ["**/*"]
  - from: "resources/node"
    to: "node"
    filter: ["**/*"]

mac:
  category: public.app-category.developer-tools
  icon: build-resources/icon.icns
  # universal2 — a single artifact runs on both Apple Silicon and Intel. The
  # bundled Node + native modules (extraResources) are lipo'd into universal
  # binaries by scripts/bundle-node.sh + stage-universal-server.sh before this
  # runs. The .zip target is REQUIRED by electron-updater (Squirrel.Mac updates
  # from the zip, not the dmg); .blockmap files (auto-generated) enable delta
  # downloads.
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  # identity/notarize stay off here — PR #4 flips both on with the Apple cert +
  # App Store Connect API key. Until then the DMG is unsigned (Gatekeeper warns).
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  notarize: false

dmg:
  # Volume title shown when the DMG is mounted. Stayed simple — earlier
  # attempt at "${version} ${env.AUTONOMOS_BUILD_SHA}" failed because
  # electron-builder 25.1.8 doesn't interpolate env vars in dmg.title,
  # leaving the literal "${env.…}" in the volume name and causing hdiutil
  # detach to fail. The output filename already carries the SHA + timestamp
  # for build-to-build differentiation (see scripts/build-dmg.sh).
  title: "autonomOS ${version}"
  icon: build-resources/icon.icns
  iconSize: 100
  contents:
    - x: 380
      y: 240
      type: link
      path: /Applications
    - x: 120
      y: 240
      type: file
