name: Test install

# Runs the hermetic install/CLI test on a Mac and Linux runner. Catches
# breakage where the install.sh + CLI lifecycle doesn't work on a clean OS.

on:
  pull_request:
    branches: [main]
  # Main's own merge commits run too (ADR-149): with "up to date" no longer
  # required, a squash can land a combination no PR run tested, and the
  # release gate (release.yml main-ci) requires these to be green at the tag.
  push:
    branches: [main]

# Least privilege (ADR-150): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    # p95 50s (darwin) / 42s (linux) over the last 30 runs.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runs-on: macos-14
          - target: linux-x64
            runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install deps
        run: bun install

      - name: Run install test
        run: bash scripts/test-install.sh
