name: Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      # Install the real Claude Code CLI so the L3 real-agent integration
      # suite (embedded-mode-integration.test.ts) can spawn a real `claude`
      # PTY against a mock Anthropic backend. Installing needs NO auth — the
      # test never calls the real API (ANTHROPIC_BASE_URL points at the mock).
      # Pinned for reproducibility; bump deliberately.
      - name: Install Claude Code CLI (for real-agent integration tests)
        run: npm i -g @anthropic-ai/claude-code@2.1.168

      # A freshly-installed claude shows a first-run onboarding/theme prompt that
      # blocks the interactive PTY session (so SessionStart never fires). Seed the
      # user config to mark onboarding complete — same fields a configured claude
      # carries. Without this the L3 integration suite times out waiting for the
      # first hook.
      - name: Pre-seed Claude Code config (skip first-run onboarding)
        run: |
          cat > "$HOME/.claude.json" <<'JSON'
          {
            "hasCompletedOnboarding": true,
            "numStartups": 5,
            "theme": "dark",
            "lastOnboardingVersion": "2.1.168"
          }
          JSON

      - name: Lint, typecheck, test
        # AUTONOMOS_INTEGRATION=1 enables the real-`claude` L3 integration suite
        # (embedded-mode-integration.test.ts). This flag is set ONLY here in CI —
        # never on a developer machine — so the suite, which spawns a real claude
        # PTY, can never run on a box that's also hosting a live autonomos
        # deployment. Local `make check` skips that suite entirely.
        env:
          AUTONOMOS_INTEGRATION: "1"
        run: make check
