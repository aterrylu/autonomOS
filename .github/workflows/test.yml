name: Check

on:
  pull_request:
    branches: [main]
  # Main's own merge commits run too (ADR-149): with "up to date" no longer
  # required, a squash can land a combination no PR run tested, and the
  # release gate (release.yml main-ci) requires these to be green at the tag.
  push:
    branches: [main]

# Least privilege (ADR-151): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # p95 128s over the last 30 runs. Without a bound a hang burns GitHub's 6h default (it did: #388).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install

      # The real Claude Code CLI (pinned) + its onboarding seed, for the L3
      # real-agent integration suites. Shared with node-floor below.
      - name: Install Claude Code CLI (for real-agent integration tests)
        run: bash scripts/ci-install-claude.sh

      - name: Lint, typecheck, test
        # AUTONOMOS_INTEGRATION=1 enables the real-`claude` L3 integration suites
        # (agent-spawn-prompt, hooks-plane, mcp-auth, permission-mode-*,
        # usage-queue). Local `make check` skips them. They are also safe to run
        # locally (ADR-103): each boot gets its own config dir, token, ephemeral
        # port, control socket, and a throwaway HOME / CLAUDE_CONFIG_DIR /
        # CODEX_HOME; the usage plugin reads no credential store; and every suite
        # ends with a test that fails if anything landed in the real ~/.claude.
        # They never touch launchd/systemd/pm2 or port 3100, and signal only
        # their own children. test-install.sh / service verbs stay CI-ONLY.
        env:
          AUTONOMOS_INTEGRATION: "1"
        run: make check

      # Bundle-size ratchet: the dashboard's gzipped JS/CSS must stay within
      # packages/dashboard/perf-budget.json (scripts/check-bundle-budget.ts).
      # `make check` doesn't build the dashboard, so build it here.
      - name: Dashboard bundle budget
        run: |
          bun --filter @autonomos/dashboard build
          packages/server/node_modules/.bin/tsx scripts/check-bundle-budget.ts

      # An agent's runaway process must kill only that agent, never the server
      # or the other agents: the REAL rendered unit and the REAL OomGuard under
      # real user systemd, with the unit's memory capped so the OOM stays in
      # it. It also proves it can fail: the pre-fix unit must be stopped
      # whole, and without the guard the server must be the victim
      # (scripts/oom-isolation-ci.sh). GitHub's runners don't start a user
      # manager on their own; linger starts one.
      - name: OOM isolation (real systemd)
        timeout-minutes: 10
        run: |
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 30); do
            systemctl --user show-environment >/dev/null 2>&1 && break
            sleep 1
          done
          bash scripts/oom-isolation-ci.sh

  # The release bundle runs on the USER's Node: install.sh accepts any
  # node >= MIN_NODE, with no ceiling (ADR-154). `check` above runs on the
  # pinned primary (.node-version); this job runs the server/CLI/scripts
  # suites, real-agent integration included, on EXACTLY the floor, so both
  # ends of what we ship are tested (ADR-163). The version is READ from
  # install.sh, never written here, so raising MIN_NODE moves this job with
  # it. The dashboard runs in a browser, so its vitest suite isn't repeated.
  node-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the install floor (install.sh MIN_NODE)
        id: floor
        run: |
          version=$(sed -n 's/^MIN_NODE=\([0-9][0-9.]*\)$/\1/p' scripts/install.sh)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::scripts/install.sh needs exactly one MIN_NODE=<major>.<minor>.<patch> line (got '$version')"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.floor.outputs.version }}

      # The runner image has its own node in /usr/local/bin. If setup-node
      # installed nothing, every step below would quietly test THAT one.
      - name: Assert the tests will run on the floor
        env:
          FLOOR: ${{ steps.floor.outputs.version }}
        run: |
          running=$(node -p 'process.versions.node')
          [ "$running" = "$FLOOR" ] || { echo "::error::node on PATH is $running, expected the install floor $FLOOR"; exit 1; }
          echo "node $running ($(command -v node))"

      - name: Install dependencies
        run: bun install

      - name: Install Claude Code CLI (for real-agent integration tests)
        run: bash scripts/ci-install-claude.sh

      - name: Server, CLI and scripts tests on the floor Node
        env:
          AUTONOMOS_INTEGRATION: "1"
        run: make _node-tests
