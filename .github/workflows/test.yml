name: Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # p95 128s over the last 30 runs. Without a bound a hang burns GitHub's 6h default (it did: #388).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      # Install the real Claude Code CLI so the L3 real-agent integration
      # suites (agent-spawn-prompt + usage-queue, via helpers/test-server.ts)
      # can spawn a real `claude` PTY against a mock Anthropic backend.
      # Installing needs NO auth — they never call the real API
      # (ANTHROPIC_BASE_URL points at the mock). Pinned for reproducibility;
      # bump deliberately.
      - name: Install Claude Code CLI (for real-agent integration tests)
        run: npm i -g @anthropic-ai/claude-code@2.1.168

      # A freshly-installed claude shows a first-run onboarding/theme prompt that
      # blocks the interactive PTY session (so SessionStart never fires). Seed the
      # user config to mark onboarding complete — same fields a configured claude
      # carries. Without this the L3 integration suite times out waiting for the
      # first hook.
      - name: Pre-seed Claude Code config (skip first-run onboarding)
        run: |
          cat > "$HOME/.claude.json" <<'JSON'
          {
            "hasCompletedOnboarding": true,
            "numStartups": 5,
            "theme": "dark",
            "lastOnboardingVersion": "2.1.168"
          }
          JSON

      - name: Lint, typecheck, test
        # AUTONOMOS_INTEGRATION=1 enables the real-`claude` L3 integration suites
        # (agent-spawn-prompt, hooks-plane, mcp-auth, permission-mode-*,
        # usage-queue). Local `make check` skips them. They are also safe to run
        # locally (ADR-103): each boot gets its own config dir, token, ephemeral
        # port, control socket, and a throwaway HOME / CLAUDE_CONFIG_DIR /
        # CODEX_HOME; the usage plugin reads no credential store; and every suite
        # ends with a test that fails if anything landed in the real ~/.claude.
        # They never touch launchd/systemd/pm2 or port 3100, and signal only
        # their own children. test-install.sh / service verbs stay CI-ONLY.
        env:
          AUTONOMOS_INTEGRATION: "1"
        run: make check
