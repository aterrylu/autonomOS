name: E2E (Dashboard UI)

# Testing layer L4 — Playwright drives the REAL dashboard (vite dev server) with
# the HTTP API + WebSocket fully MOCKED in-browser. There is NO autonomos backend
# and NO `claude`/agent/PTY in this job, so AUTONOMOS_INTEGRATION is deliberately
# NOT set (that flag gates the L3 real-agent suite in test.yml, not this one).
on:
  pull_request:
    branches: [main]
  # Main's own merge commits run too (ADR-149): with "up to date" no longer
  # required, a squash can land a combination no PR run tested, and the
  # release gate (release.yml main-ci) requires these to be green at the tag.
  push:
    branches: [main]

# Least privilege (ADR-150): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # p95 99s over the last 30 runs; bounded so a hang fails fast instead of at the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned (was `latest`): a floating bun drifted mid-day and
          # deterministically broke this e2e spec once. Set to the CURRENT
          # latest (1.3.14, 2026-08) so e2e matches what the other workflows'
          # `latest` resolves to today; bump deliberately. A fleet-wide pin
          # across all workflows is ReleaseTooling's call.
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      # Chromium only — fast, and all the mocked-API UI flows need.
      - name: Install Playwright browser (chromium)
        working-directory: packages/dashboard
        run: bunx playwright install --with-deps chromium

      # Playwright's webServer config boots `vite` itself (the dashboard dev
      # server) and tears it down when the run ends — no manual server start,
      # no backend. In CI, reuseExistingServer is off so the server is fresh.
      - name: Run Playwright e2e
        working-directory: packages/dashboard
        env:
          CI: "true"
        run: bunx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: packages/dashboard/playwright-report/
          retention-days: 7
