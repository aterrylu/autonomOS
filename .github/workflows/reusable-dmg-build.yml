name: Reusable DMG build

# Single source of truth for the universal2 macOS DMG pipeline, invoked via
# `workflow_call` by BOTH:
#   - release.yml  (sign: true,  validate_intel: true)  — on a `v*` tag / dispatch
#   - pr-artifact.yml (sign: false, validate_intel: false) — on relevant PRs
#
# Produces (uploaded as run artifacts the caller can download):
#   - 4 server tarballs (darwin/linux × arm64/x64)  → install.sh
#   - raw darwin server bundles (for the universal lipo)
#   - universal2 .app DMG + ZIP + blockmap + latest-mac.yml → Desktop app
#
# The DMG is universal2: one artifact runs on Apple Silicon AND Intel — the
# bundled Node + native modules are lipo'd from both arches (bundle-node.sh +
# stage-universal-server.sh). PR builds are UNSIGNED (fast, no Apple secrets,
# no notary); release builds sign (Developer ID) + notarize when sign=true and
# the secrets are present.

on:
  workflow_call:
    inputs:
      sign:
        description: "Sign + notarize the DMG (release only). false → unsigned (PR / forks)."
        type: boolean
        default: false
      validate_intel:
        description: "Run the native-Intel Gatekeeper/exec gate on real x64 hardware (release only)."
        type: boolean
        default: false
    secrets:
      # All optional — only consumed when sign=true. PR callers pass none, so a
      # PR build never receives the signing material (defense beyond sign=false).
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false

permissions:
  contents: read

jobs:
  # ── 1. Server bundles ────────────────────────────────────────────────────
  # Four platform tarballs for install.sh. The two darwin bundles are ALSO
  # uploaded raw so the DMG job can lipo their native modules into universal.
  build-server:
    name: Server (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runs-on: macos-14
          - target: darwin-x64
            runs-on: macos-15-intel
          - target: linux-x64
            runs-on: ubuntu-latest
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # Pin Node 22 LTS so node-pty's nan-based native binding compiles cleanly
      # (it does NOT build against Node 25's V8 headers). The bundled Node
      # (build-dmg job) is pinned to the SAME version so the ABIs match — the
      # smoke gate enforces this.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build dashboard
        run: bun --filter @autonomos/dashboard build
      - name: Embed dashboard
        run: bun packages/server/build/embed-dashboard.ts
      - name: Build bundle + tarball
        run: TARBALL=1 bun packages/server/build/build-binary.ts
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: packages/server/dist/autonomos-${{ matrix.target }}.tar.gz
      # darwin bundles feed the universal DMG's native-module lipo.
      - name: Upload raw darwin bundle
        if: startsWith(matrix.target, 'darwin')
        uses: actions/upload-artifact@v4
        with:
          name: serverdist-${{ matrix.target }}
          path: packages/server/dist/${{ matrix.target }}/

  # ── 2. Universal2 macOS DMG ──────────────────────────────────────────────
  # Built on Apple Silicon. Stages universal resources (lipo the two darwin
  # server bundles + a universal Node), then electron-builder produces the
  # universal2 .app/DMG/ZIP. Hard-gated by the headless smoke test.
  build-dmg:
    name: Universal DMG
    needs: build-server
    runs-on: macos-14
    env:
      # The bundled universal Node version — MUST equal the build-server Node
      # (22) so its ABI matches the node-pty binding in the staged server
      # bundle. The smoke gate enforces it.
      BUNDLE_NODE_VERSION: v22.13.0
    steps:
      - uses: actions/checkout@v4
      # Pin Node 22 so this job's `bun install` also compiles node-pty cleanly
      # (nan doesn't build against Node 25). node-pty is unused here, but a
      # failed install would still break the job.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Download darwin server bundles
        uses: actions/download-artifact@v4
        with:
          path: serverdist
          pattern: serverdist-darwin-*

      - name: Stage universal server bundle (lipo native modules)
        run: |
          bash packages/app/scripts/stage-universal-server.sh \
            serverdist/serverdist-darwin-arm64 \
            serverdist/serverdist-darwin-x64 \
            packages/app/resources/server

      - name: Stage universal Node
        run: BUNDLE_NODE_UNIVERSAL=1 bash packages/app/scripts/bundle-node.sh

      - name: Smoke test (HARD GATE — universal slices + server boot + auth)
        run: SMOKE_EXPECT_UNIVERSAL=1 bash scripts/smoke-test-bundle.sh
        working-directory: packages/app

      - name: Build app + universal DMG/ZIP
        working-directory: packages/app
        # Cap the step so a stalled/degraded Apple notary fails the release FAST
        # (retryable in minutes) instead of hanging for hours on `notarytool
        # --wait`. Normal notarization is well under 10 min; packaging adds a few.
        # 30 min leaves generous headroom for a slow-but-healthy notary while
        # killing a genuine Apple-side incident (we've seen 85+ min stalls).
        timeout-minutes: 30
        env:
          SIGN: ${{ inputs.sign }}
          # Secrets are passed through under SECRET_ names that are always set
          # (empty on PR callers). They are only PROMOTED to the electron-builder
          # vars (CSC_LINK / APPLE_API_KEY) inside the shell when SIGN=true. This
          # avoids ever setting CSC_LINK="" on an unsigned build — electron-builder
          # treats an empty CSC_LINK as a (missing) cert path and errors.
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          SECRET_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SECRET_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Apple Developer Team ID (from the Developer ID cert — not secret).
          APPLE_TEAM_ID: "39VWFRL3PM"
        run: |
          # Resolve signing config BEFORE `bun run build` so the signing env is
          # present for the whole step — matching the original step-level `env:`
          # timing (the extraction must not shift when these become visible).
          notarize_flags=""
          if [ "${SIGN}" = "true" ]; then
            # Promote secrets to the names electron-builder + @electron/notarize read.
            export CSC_LINK="${SECRET_CSC_LINK}"
            export CSC_KEY_PASSWORD="${SECRET_CSC_KEY_PASSWORD}"
            export APPLE_API_KEY_ID="${SECRET_APPLE_API_KEY_ID}"
            export APPLE_API_ISSUER="${SECRET_APPLE_API_ISSUER}"
            # Notarize ONLY when the API key secret is present. Otherwise (cert but
            # no key, or no creds at all) produce a plain build — keeps the pipeline
            # green either way. The validate-intel Gatekeeper gate (which a signed
            # build ALWAYS runs) is the backstop that a shipped DMG is notarized.
            if [ -n "${SECRET_APPLE_API_KEY_B64}" ]; then
              printf '%s' "${SECRET_APPLE_API_KEY_B64}" | base64 -d > "${RUNNER_TEMP}/AuthKey.p8"
              export APPLE_API_KEY="${RUNNER_TEMP}/AuthKey.p8"
              notarize_flags="--config.mac.notarize.teamId=${APPLE_TEAM_ID}"
              echo "::notice::Apple credentials present — signing + notarizing."
            elif [ -n "${CSC_LINK}" ]; then
              echo "::warning::Signing cert present but no notarization key — DMG will be signed but NOT notarized (Gatekeeper still warns on download)."
            else
              echo "::warning::sign=true but no CSC_LINK secret — producing an UNSIGNED build."
            fi
          else
            # PR / unsigned path: never set CSC_LINK, and stop electron-builder from
            # auto-discovering a keychain cert → a clean unsigned build, fast (no notary).
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::notice::Unsigned build (sign=false) — PR artifact gate / fork."
          fi
          bun run build
          # shellcheck disable=SC2086 # notarize_flags is intentionally word-split
          bunx electron-builder --mac dmg zip --universal --publish never ${notarize_flags}

      # The full UI validation (launches Electron + drives via CDP). Confirmed to
      # run on a headless GitHub macOS runner (the one CI unknown), so it's a
      # HARD GATE — a broken Try-it-out flow fails the build. It ALSO runs an
      # idle-renderer CPU peg-detector (Phase 2 inside the script): relaunches on
      # the idle Welcome screen, samples the app process tree's CPU over 10s, and
      # fails if it exceeds 80% of one core — guarding the #176 GPU-compositor peg
      # class (~195% idle) that CDP's JS-timing metrics can't see.
      # CAVEAT: validate-dmg.sh stubs `claude` on PATH so the ephemeral server
      # clears its provider preflight. That means this gate covers only the
      # PROVIDER-PRESENT first-run. A fresh Mac with NO provider binary currently
      # hits a separate, known product bug (server exit(1)s at preflight → Welcome
      # hangs); the green gate does NOT certify that path. See docs/TESTING.md.
      - name: Validate DMG (HARD GATE — first-run flow + idle-CPU peg-detector)
        run: bash scripts/validate-dmg.sh "$(ls out/*.dmg | head -1)"
        working-directory: packages/app

      - name: Upload DMG + update feed
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: |
            packages/app/out/*.dmg
            packages/app/out/*.zip
            packages/app/out/*.blockmap
            packages/app/out/latest-mac.yml

  # ── 3. Native Intel validation (release only) ────────────────────────────
  # Mount the universal DMG on REAL x64 hardware and run the bundle smoke test
  # natively — proves the x64 slice actually executes (no Rosetta dependency).
  # Gated by validate_intel so PR builds skip the expensive macos-15-intel runner.
  # SAFETY: also runs whenever sign=true, so a SIGNED build can NEVER skip the
  # Gatekeeper/notarization gate below — even if validate_intel were mis-wired to
  # false. (A skipped job counts as success to `needs:`, so without this a signed
  # release could publish an unverified DMG, green. `|| inputs.sign` forecloses that.)
  validate-intel:
    name: Validate on Intel
    needs: build-dmg
    if: ${{ inputs.validate_intel || inputs.sign }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dmg
      - name: Mount + native x64 smoke test
        run: |
          DMG="$(ls dmg/*.dmg | head -1)"
          echo "Mounting ${DMG} on $(uname -m)..."
          hdiutil attach -nobrowse "${DMG}"
          VOL="$(ls -d /Volumes/autonomOS* | head -1)"
          APP="${VOL}/autonomOS.app/Contents/Resources"
          bash packages/app/scripts/smoke-test-bundle.sh \
            "${APP}/node/bin/node" "${APP}/server/index.js"

          # Signing / notarization gate. The whole point of #4 is "opens without a
          # Gatekeeper warning" — assert it for real on Intel hardware. Invariant:
          # a build is EITHER fully unsigned (dev / no creds) OR signed AND
          # notarized AND stapled. A signed-but-not-notarized build still warns on
          # download, so we treat it as a failure rather than ship it.
          APP_BUNDLE="${VOL}/autonomOS.app"
          if codesign -dvv "${APP_BUNDLE}" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "Developer ID signature found — verifying signature + notarization..."
            codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}"
            # Assert on spctl's EXIT CODE, not a substring of its prose. spctl
            # --assess returns non-zero on rejection; matching "accepted" in -vv
            # output is fragile to Apple wording drift on the single most
            # load-bearing release gate. pipefail so the piped exit code survives.
            set -o pipefail
            if ! spctl --assess --type exec -vv "${APP_BUNDLE}" 2>&1 | tee /tmp/spctl.log; then
              echo "::error::Gatekeeper REJECTED the app (spctl --assess exit nonzero). Signed but not notarized/stapled? Set the APPLE_API_KEY/_ID/_ISSUER secrets."
              cat /tmp/spctl.log
              hdiutil detach "${VOL}" -force || true
              exit 1
            fi
            set +o pipefail
            xcrun stapler validate "${APP_BUNDLE}"
            echo "✓ signed + notarized + stapled — Gatekeeper accepts it (no warning on download)"
          else
            echo "::warning::App is UNSIGNED (no Apple credentials at build time) — skipping Gatekeeper checks."
          fi
          hdiutil detach "${VOL}" -force || true
