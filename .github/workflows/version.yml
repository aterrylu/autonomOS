name: Version

# Maintains the "Version Packages" PR. Every push to main re-evaluates pending
# changesets: if any exist, the changesets action opens/updates a PR that bumps
# all packages (lockstep via the `fixed` group) and regenerates CHANGELOG.md.
# When that PR is merged (no changesets remain), we tag vX.Y.Z and push — which
# triggers the release build (see release.yml).
#
# Releasing = merge the "Version Packages" PR. No manual version edits, ever.
#
# RELEASE_PAT (one-time setup) — without it, releases need TWO manual nudges.
# GitHub deliberately does NOT trigger downstream workflows for actions taken with
# the default GITHUB_TOKEN (anti-recursion). That bites this pipeline twice:
#   1. the Version PR is opened by the github-actions bot → the required `check`
#      workflow never runs → the PR sits BLOCKED (can't merge without reopening it);
#   2. the version tag is pushed by the bot → release.yml never fires → no release.
# Providing a Personal Access Token (or GitHub App token) as the `RELEASE_PAT`
# secret makes both the PR and the tag push come from a real identity, so CI and
# the release build trigger automatically — releasing becomes one merge, hands-off.
#
# Fine-grained PAT scopes (this repo only): Contents: Read and write,
# Pull requests: Read and write. Store it as the `RELEASE_PAT` repo secret. Until
# the secret exists, the expressions below fall back to GITHUB_TOKEN and the
# pipeline behaves exactly as before (manual reopen + tag re-push).

on:
  push:
    branches: [main]

concurrency: version-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    # `bun install` runs the root `prepare` script, which runs `lefthook install`
    # and writes .git/hooks/{pre-commit,commit-msg,pre-push}. This job both
    # commits and pushes — the changesets action stages the regenerated
    # package.json + CHANGELOG.md and commits them (the `commit:` input below)
    # before pushing, and the tag step pushes again — so all three fire on the
    # runner, each a DEVELOPER-machine gate never meant to run here.
    #
    # Both failure modes are opaque. `pre-push` (`biome check && make check`)
    # surfaces only as `error: failed to push some refs`, which reads like a
    # permissions problem rather than a test failure. `pre-commit` runs biome
    # over the staged files — which include generated package.json files — and
    # would abort the commit, so the Version PR would simply never appear.
    #
    # It should not run here regardless: this job's environment is deliberately
    # leaner than the PR gate's (test.yml installs the Claude Code CLI for the
    # integration suites; this job installs nothing), so `make check` is not even
    # running the same thing. The PR `check` workflow is the real gate — nothing
    # reaches main without passing it (`check` is required, `strict: true`,
    # `enforce_admins: true`), so re-running a subset of it against a bot's push
    # of generated changelog files gates releases on noise.
    #
    # Be honest about what this costs, though: that leaner environment was also
    # the one thing here worth having. This was the only CI run of the suite on a
    # box with no `claude` installed, which is why it — and only it — caught a
    # test that had come to depend on host-installed tooling. Turning the hook off
    # removes that detector. The replacement is to make such tests assert their
    # own preconditions rather than inherit them from the runner; see the
    # resolveBinary() assertion in control-plane-503.test.ts for the pattern.
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Persist these credentials for the later `git push` of the tag. Using
          # the PAT (when set) makes the tag push come from a real identity so it
          # triggers release.yml; falls back to GITHUB_TOKEN (no auto-trigger).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Maintain Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          # No `publish` — releases are produced by release.yml on the v-tag,
          # not by `changeset publish` (these packages are not on npm).
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          # PAT (when set) opens the Version PR as a real identity so the required
          # `check` workflow runs on it; falls back to GITHUB_TOKEN (PR won't
          # trigger CI → stays BLOCKED until manually reopened).
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # When the Version PR has just been merged, no changesets remain. Tag the
      # new version (if not already tagged) to kick off the release build.
      - name: Tag release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./packages/server/package.json').version")
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already tagged — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          echo "Tagged and pushed v${VERSION}"
