# Deploys website/ to GitHub Pages → https://autonomos.terrylu.cloud
#
# One-time setup (owner's lane — 2 steps, no tokens, no secrets):
#   1. Repo Settings → Pages → Source: "GitHub Actions" (this ENABLES Pages —
#      the first workflow run before this step fails with "Get Pages site
#      failed"; that error means do this step, nothing else), then set the
#      custom domain to autonomos.terrylu.cloud (GitHub provisions TLS).
#      Self-enabling from the workflow is NOT possible: configure-pages
#      `enablement` needs administration:write, which workflow tokens can't
#      be granted.
#   2. Cloudflare DNS (terrylu.cloud zone — Squarespace is only the registrar;
#      the nameservers are Cloudflare's, so records go in the CF dashboard):
#      add CNAME  autonomos → aterrylu.github.io  (DNS-only / grey cloud, so
#      GitHub's Let's Encrypt cert issuance can verify).
#
# Until the DNS lands, the same deploy serves at aterrylu.github.io/autonomOS/
# — every asset path in the page is relative, so both roots work.
#
# The hero image is single-sourced from docs/assets/hero.png (the `make hero`
# output) — copied over the committed website/assets/hero.png at deploy time so
# the site can never drift from the README's screenshot. That's also why this
# workflow triggers on hero.png changes, not just website/ ones. A guard step
# fails the deploy if the PNG's real dimensions stop matching the width/height
# attributes in index.html (a re-shoot at a new viewport must touch both).
#
# Actions are pinned to full commit SHAs (tags are mutable). To upgrade: bump
# the SHA and the trailing version comment together.
name: site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/assets/hero.png"
      - "scripts/install.sh"
      - "scripts/verify-provenance.mjs"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# One deployment at a time; queued runs collapse to the newest. Do NOT cancel
# in-progress: deploy-pages has no post: cleanup, so a cancelled run abandons
# an in-flight github-pages deployment mid-poll. Deployments are serialized
# per environment, so newest-commit-wins holds without cancellation.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # p95 22s over the last 12 runs.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # full history so the hero-changed check below can diff the push range
          fetch-depth: 0

      - name: Sync hero from docs (single source of truth)
        run: cp docs/assets/hero.png website/assets/hero.png

      - name: Serve the installer from the domain (single source of truth)
        # https://autonomos.terrylu.cloud/install.sh — copied from scripts/
        # at deploy time (never committed under website/, so it can't drift);
        # the paths trigger above includes scripts/install.sh for the same
        # reason it includes the hero.
        #
        # The provenance verifier it pins by sha256 (ADR-122) ships in the SAME
        # deploy, so the two can't go live apart. (CI's `make check` already
        # proved the pin matches this file.)
        run: |
          cp scripts/install.sh website/install.sh
          cp scripts/verify-provenance.mjs website/verify-provenance.mjs

      - name: Did this push touch the hero or its HTML?
        # Scopes the dimension guard below: an installer-only (or CSS-only)
        # push must not be held hostage by a pre-existing hero/HTML mismatch —
        # the guard exists to catch the push that CREATES a mismatch, and that
        # push necessarily touches one of these three files. When the range
        # can't be computed (manual dispatch, branch creation, force-push gap)
        # we default to RUNNING the guard.
        id: hero-changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$AFTER" -- docs/assets/hero.png website/index.html website/assets/hero.png | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard — index.html width/height must match the real hero PNG
        if: steps.hero-changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          w=$(od -An -tu4 -j16 -N4 --endian=big website/assets/hero.png | tr -d ' ')
          h=$(od -An -tu4 -j20 -N4 --endian=big website/assets/hero.png | tr -d ' ')
          echo "hero.png is ${w}x${h}"
          if ! grep -q "width=\"${w}\" height=\"${h}\"" website/index.html; then
            echo "::error::website/index.html hero <img> attrs don't match hero.png (${w}x${h})."
            echo "::error::A hero re-shoot changed the viewport — update width/height in website/index.html."
            exit 1
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Smoke — the served installer's pin matches the served verifier
        # A piped install (curl | bash) fetches the verifier from this site and
        # refuses if its sha256 differs from install.sh's pin. Catch that here,
        # not in a newcomer's terminal. Retries ride out the Pages CDN cache
        # (max-age 600) serving the previous deploy's files for a while.
        run: |
          for i in $(seq 1 30); do
            pin=$(curl -fsSL "https://autonomos.terrylu.cloud/install.sh?smoke=$i" | sed -n 's/^VERIFIER_SHA256="\([0-9a-f]\{64\}\)"$/\1/p' || true)
            got=$(curl -fsSL "https://autonomos.terrylu.cloud/verify-provenance.mjs?smoke=$i" | shasum -a 256 | awk '{print $1}' || true)
            want=$(sha256sum scripts/verify-provenance.mjs | awk '{print $1}')
            if [[ -n "$pin" && "$pin" == "$got" && "$got" == "$want" ]]; then
              echo "✓ served install.sh pins the served verifier ($got)"; exit 0
            fi
            echo "attempt $i: pin=${pin:-none} served=$got want=$want — retrying in 30s"
            sleep 30
          done
          echo "✗ the live site serves an install.sh whose pin doesn't match its verifier: every piped install refuses" >&2
          exit 1
