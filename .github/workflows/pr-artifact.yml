name: PR Artifact Gates (L5/L6)

# Runs the FULL universal2 DMG build + smoke + validate-dmg (first-run flow +
# idle-CPU peg-detector) on PRs that touch the artifact surface — so cross-arch
# lipo / native-module / bundling / first-run regressions are caught at PR time
# instead of only at release. UNSIGNED (no Apple secrets, no notary). The
# native-Intel gate (L6b) and signing/notarization (L7) stay release-only.
#
# Shares reusable-dmg-build.yml with release.yml — single source of truth for
# the build. Here: sign=false, validate_intel=false, no secrets passed.
#
# Path-filtered: docs-only / dashboard-only PRs skip this entirely (the dashboard
# has its own L2/L4 gates in test.yml + e2e.yml; it's embedded at build time but
# its source changes don't affect the server bundle / native modules / packaging).

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/server/**"
      - "packages/app/**"
      - "packages/cli/**"
      - "packages/core/**"
      - ".github/workflows/pr-artifact.yml"
      - ".github/workflows/reusable-dmg-build.yml"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/reusable-dmg-build.yml
    with:
      sign: false
      validate_intel: false
    # No secrets passed — a PR build never receives the signing material.
