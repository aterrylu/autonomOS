name: Release

# Triggered by pushing a `v*` tag (created by version.yml when the "Version
# Packages" PR merges). Produces:
#   - 4 server tarballs (darwin/linux × arm64/x64) + SHA256SUMS  → install.sh
# all attached to a GitHub Release whose body is the CHANGELOG section.
#
# The build itself (the 4 server bundles) lives in the reusable
# reusable-server-build.yml. Here we invoke it, then publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything but do NOT publish a release (use to test the server-tarball build before cutting a real release)."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The 4 server bundles (darwin/linux × arm64/x64) for install.sh.
  build:
    uses: ./.github/workflows/reusable-server-build.yml

  # ── Only a commit on main is ever published (security audit V5) ──────────
  # A `v*` tag is just a name: anyone with push access can put one on an
  # unreviewed commit, and main is where review is enforced. So the release
  # job below needs this check to pass.
  #
  # What this does NOT stop, stated so nobody leans on it: for a tag push,
  # GitHub runs THIS FILE AS IT EXISTS IN THE TAGGED COMMIT, so a deliberate
  # off-main tag can simply delete this job from its own copy. It catches the
  # accidental case (a tag cut from the wrong ref, a dispatch with
  # dry_run=false from a feature branch). The deliberate case is stopped by
  # the tag ruleset on refs/tags/v* (tag creation restricted) and by the
  # installers, which check the tag against origin/main on the user's machine
  # (sourceUpgrade.ts, install-source.sh).
  #
  # Read-only, and it never installs or runs the tagged commit's code.
  on-main:
    name: Tag is on main
    if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a commit that main does not contain
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "$GITHUB_SHA is on main."
          else
            echo "::error::$GITHUB_REF ($GITHUB_SHA) is not on main. Releases are cut only from reviewed commits on main; refusing to publish."
            exit 1
          fi

  # Main's CI must be GREEN at the tagged commit (ADR-149). PRs no longer have
  # to be up to date with main, so a squash can land a combination no PR run
  # tested; main's own push runs test it, and a release must not ship until
  # they pass. The tag is created right after the version PR merges, while that
  # commit's runs are still going, so this waits (bounded) for them.
  main-ci:
    name: Main CI is green at the tag
    if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for main's push runs on this commit, and require success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          deadline=$((SECONDS + 3600))      # a run must FINISH within an hour
          appear_by=$((SECONDS + 900))      # and START within 15 minutes
          for wf in test.yml e2e.yml test-install.yml; do
            while :; do
              runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --event push \
                --branch main --commit "$SHA" --json databaseId,status,conclusion,url --limit 5)
              if [ "$(jq length <<<"$runs")" = 0 ]; then
                if [ "$SECONDS" -gt "$appear_by" ]; then
                  echo "::error::No $wf run on main for $SHA. Releases need main's CI to have run (and passed) on the tagged commit; refusing to publish."
                  exit 1
                fi
              else
                status=$(jq -r '.[0].status' <<<"$runs")
                conclusion=$(jq -r '.[0].conclusion' <<<"$runs")
                url=$(jq -r '.[0].url' <<<"$runs")
                if [ "$status" = completed ]; then
                  if [ "$conclusion" = success ]; then
                    echo "✓ $wf passed on main at $SHA ($url)"
                    break
                  fi
                  echo "::error::$wf concluded '$conclusion' on main at $SHA ($url). Fix main (or re-run a flaky job), then re-run this release; refusing to publish."
                  exit 1
                fi
              fi
              if [ "$SECONDS" -gt "$deadline" ]; then
                echo "::error::Timed out waiting for $wf on main at $SHA; refusing to publish. Re-run this job once main's CI finishes."
                exit 1
              fi
              sleep 30
            done
          done

  # ── Publish ──────────────────────────────────────────────────────────────
  # Skipped entirely on a dry-run dispatch — the server-tarball build above
  # still runs, so a dry-run proves the build pipeline without creating a
  # release. Publishes only on a real `v*` tag (or an explicit dry_run=false
  # dispatch).
  release:
    name: Publish release
    needs: [build, on-main, main-ci]
    if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance attestation needs an OIDC token + the attestations scope.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Assemble release directory
        run: |
          mkdir -p release
          find artifacts -name 'autonomos-*.tar.gz' -exec cp {} release/ \;
          (cd release && shasum -a 256 autonomos-*.tar.gz > SHA256SUMS)
          ls -la release/

      # SLSA build provenance — Sigstore-signed attestations linking each
      # shipped artifact back to this workflow run + source commit (SLSA L2).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/autonomos-*.tar.gz

      - name: Extract release notes from CHANGELOG
        run: bun scripts/release-notes.ts > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          files: release/*
          fail_on_unmatched_files: true
