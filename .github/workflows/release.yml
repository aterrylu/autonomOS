name: Release

# Triggered by pushing a `v*` tag (created by version.yml when the "Version
# Packages" PR merges). Produces:
#   - 4 server tarballs (darwin/linux × arm64/x64) + SHA256SUMS  → install.sh
#   - universal2 macOS DMG + ZIP + blockmap + latest-mac.yml     → Desktop app
# all attached to a GitHub Release whose body is the CHANGELOG section.
#
# The build itself (server bundles + universal DMG + smoke + validate-dmg +
# native-Intel gate) lives in the reusable reusable-dmg-build.yml, shared with
# pr-artifact.yml. Here we invoke it with sign + validate_intel ON, then publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + validate everything but do NOT publish a release (use to test the universal DMG build before cutting a real release)."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Server bundles + universal2 DMG + smoke + validate-dmg + native-Intel gate.
  # sign + validate_intel ON — this is the real, shippable build. Secrets are
  # passed explicitly (the reusable workflow only consumes them when sign=true).
  build:
    uses: ./.github/workflows/reusable-dmg-build.yml
    with:
      sign: true
      validate_intel: true
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # ── Publish ──────────────────────────────────────────────────────────────
  # Skipped entirely on a dry-run dispatch — the build + both validation gates
  # above still run, so a dry-run proves the whole pipeline without creating a
  # release. Publishes only on a real `v*` tag (or an explicit dry_run=false
  # dispatch).
  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance attestation needs an OIDC token + the attestations scope.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release directory
        run: |
          mkdir -p release
          find artifacts -name 'autonomos-*.tar.gz' -exec cp {} release/ \;
          find artifacts -name '*.dmg'         -exec cp {} release/ \;
          find artifacts -name '*.zip'         -exec cp {} release/ \;
          # Only the ZIP's blockmap — electron-updater (Squirrel.Mac) updates
          # from the .zip, never the .dmg, so the .dmg.blockmap is dead weight.
          find artifacts -name '*.zip.blockmap' -exec cp {} release/ \;
          find artifacts -name 'latest-mac.yml' -exec cp {} release/ \;
          (cd release && shasum -a 256 autonomos-*.tar.gz *.dmg > SHA256SUMS)
          ls -la release/

      # SLSA build provenance — Sigstore-signed attestations linking each
      # shipped artifact back to this workflow run + source commit (SLSA L2).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/autonomos-*.tar.gz
            release/*.dmg
            release/*.zip

      - name: Extract release notes from CHANGELOG
        run: bun scripts/release-notes.ts > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release/*
          fail_on_unmatched_files: true
