name: CLI permission drift

# Nightly: install the LATEST Claude Code, Codex and Gemini CLIs and check that
# each still accepts exactly the permission options autonomOS offers
# (RUNTIME_PERMISSIONS). A CLI update that drops, renames or adds an option
# fails this job with an error naming the option, instead of surfacing later as
# a broken spawn. No auth: the probe only parses flags, loads config and reads
# Codex's offline app-server schema (packages/server/src/runtimeProbe.ts).
#
# Not on pull requests on purpose: it tracks the CLIs' releases, not our diff,
# and the per-PR `check` job pins an older Claude Code for its integration
# suites. The verdict logic itself is guarded per PR by cli-drift.test.ts.

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:

# Least privilege (ADR-151): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      - name: Install the latest agent CLIs
        run: npm i -g @anthropic-ai/claude-code@latest @openai/codex@latest @google/gemini-cli@latest

      - name: Check each CLI's permission options against the table
        run: packages/server/node_modules/.bin/tsx scripts/check-cli-drift.ts --require claude-code,codex,gemini-cli
