# TEMPORARY (removed before this PR is marked ready): Linux reproduction rig
# for the ci-gate-lock.test.ts 300s CI timeouts (10-08). Runs both gate-lock
# suites 15 times on ubuntu (flock path) with per-test timeouts.
name: zz temp repro gate-lock
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/zz-temp-repro-gate-lock.yml", "scripts/run-bounded.*", "scripts/ci-gate-lock.*"]
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: bun install
      - name: lsof / flock present?
        run: command -v lsof flock || true
      - name: 15 runs of both suites
        run: |
          fails=0
          for i in $(seq 1 15); do
            if ! scripts/test-file.sh scripts/ci-gate-lock.test.ts scripts/run-bounded.test.ts > run-$i.log 2>&1; then
              fails=$((fails+1)); echo "=== RUN $i FAILED (exit $?)"; sed 's/\x1b\[[0-9;]*m//g' run-$i.log | grep -nE "not ok|✖|timed out|Error|fail [1-9]|# fail" | head -30; echo "--- tail"; sed 's/\x1b\[[0-9;]*m//g' run-$i.log | tail -60
            else
              echo "run $i ok ($(sed 's/\x1b\[[0-9;]*m//g' run-$i.log | grep -E '(ℹ|#) (pass|duration_ms)' | tr '\n' ' '))"
            fi
          done
          echo "FAILED RUNS: $fails / 15"
          test "$fails" -eq 0
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-lock-repro-logs
          path: run-*.log
  repro-main-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: bun install
      - name: lsof / flock present?
        run: command -v lsof flock || true
      - name: BASELINE — main's run-bounded.sh + gate-lock tests
        run: git checkout origin/main -- scripts/run-bounded.sh scripts/ci-gate-lock.test.ts scripts/run-bounded.test.ts && git status --short
      - name: 15 runs of both suites
        run: |
          fails=0
          for i in $(seq 1 15); do
            if ! scripts/test-file.sh scripts/ci-gate-lock.test.ts scripts/run-bounded.test.ts > run-$i.log 2>&1; then
              fails=$((fails+1)); echo "=== RUN $i FAILED (exit $?)"; sed 's/\x1b\[[0-9;]*m//g' run-$i.log | grep -nE "not ok|✖|timed out|Error|fail [1-9]|# fail" | head -30; echo "--- tail"; sed 's/\x1b\[[0-9;]*m//g' run-$i.log | tail -60
            else
              echo "run $i ok ($(sed 's/\x1b\[[0-9;]*m//g' run-$i.log | grep -E '(ℹ|#) (pass|duration_ms)' | tr '\n' ' '))"
            fi
          done
          echo "FAILED RUNS: $fails / 15"
          test "$fails" -eq 0
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-lock-baseline-logs
          path: run-*.log
